<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:;base64,=" />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./index.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <button id="play-button" class="button">Play/Pause</button>
        <div class="bpm-container">
          <span>BPM</span>
          <input type="range" id="bpm-input" class="bpm-input" min="60" max="160" value="100" />
          <span id="bpm-text" class="bpm-text">100</span>
        </div>
      </div>
      <div class="units-panel">
        <div id="unit-card-1" class="unit-card">
          <unit-frame-scaled
            unit-id="effect1"
            dest-spec="$output"
            url="units/sunset-delay/index.js"
          ></unit-frame-scaled>
        </div>
        <div id="unit-card-2" class="unit-card">
          <unit-frame-scaled
            unit-id="synth1"
            dest-spec="effect1"
            url="units/webaudio-tinysynth-mini/index.html"
          ></unit-frame-scaled>
        </div>
        <div id="unit-card-3" class="unit-card">
          <unit-frame-scaled
            unit-id="drum1"
            dest-spec="$output"
            url="units/graphite-drum-machine/index.js"
          ></unit-frame-scaled>
        </div>
        <div id="unit-card-4" class="unit-card">
          <unit-frame-scaled
            unit-id="sequencer1"
            dest-spec="synth1"
            url="units/tonerio-sequencer/index.html"
          ></unit-frame-scaled>
        </div>
      </div>
    </div>
  </body>
</html>
